name: gate-skip
on:
  push:
  workflow_dispatch:

jobs:
  #  Stands in for "did packaging change?"
  changes:
    runs-on: ubuntu-latest
    outputs:
      packaging: ${{ steps.f.outputs.packaging }}
    steps:
      - id: f
        run: echo "packaging=false" >> "$GITHUB_OUTPUT"

  #  Stands in for docker-refresh: SKIPPED when nothing changed.
  refresh:
    needs: [changes]
    if: needs.changes.outputs.packaging == 'true'
    uses: ./.github/workflows/child-pass.yml

  #  Does a leg still run when its needs: job was skipped?
  ci_default:
    needs: [refresh]
    runs-on: ubuntu-latest
    steps:
      - run: echo "ci_default ran"

  ci_tolerant:
    needs: [refresh]
    if: ${{ !cancelled() && needs.refresh.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "ci_tolerant ran; refresh.result=${{ needs.refresh.result }}"
